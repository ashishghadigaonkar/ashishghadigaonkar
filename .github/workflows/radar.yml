name: Activity Radar
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  activity-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ashishghadigaonkar
          template: classic
          base: ""
          
          # Focus only on the Activity Overview summary (Radar Chart)
          plugin_activity: yes
          plugin_activity_type: summary
          plugin_activity_filter: all
          plugin_activity_charts: yes
          plugin_activity_charts_radar: yes
          
          filename: activity-radar.svg
